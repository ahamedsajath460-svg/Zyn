# Zen AI Cloud Studio - removes old cloud artifacts and old cloud workflow runs to save free storage.
# Repository root file: .github/workflows/cloud-android-cleanup.yml
# Only touches artifacts named "cloud-*" and runs of the Cloud Android workflows. Zen AI release APKs are never touched.
name: Cloud Android Cleanup
run-name: "zen-cloud cleanup"

on:
  workflow_dispatch:
    inputs:
      days:     { description: "Delete cloud artifacts older than this many days", required: false, type: string, default: "3" }
      keep_runs: { description: "Keep the newest N finished cloud runs", required: false, type: string, default: "30" }
      dry_run:  { description: "true = only list what would be deleted", required: false, type: choice, options: ["false", "true"], default: "false" }
  schedule:
    - cron: "23 3 * * 0"        # weekly, Sunday 03:23 UTC

permissions:
  contents: read
  actions: write

concurrency:
  group: zen-cloud-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DAYS: ${{ inputs.days || '3' }}
      KEEP: ${{ inputs.keep_runs || '30' }}
      DRY: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Delete old artifacts and runs
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]{1,3}$ && "$KEEP" =~ ^[0-9]{1,4}$ ]] || { echo "::error::days and keep_runs must be numbers"; exit 1; }
          CUT=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cloud artifacts older than $CUT; keeping the newest $KEEP finished cloud runs; dry run: $DRY"
          N=0; BYTES=0
          while read -r id name size; do
            [ -z "$id" ] && continue
            echo "artifact $name ($size bytes)"; N=$((N+1)); BYTES=$((BYTES+size))
            [ "$DRY" = "true" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > /dev/null
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts[] | select((.name|startswith(\"cloud-\")) and .created_at < \"$CUT\") | \"\(.id) \(.name) \(.size_in_bytes)\"")
          R=0
          while read -r id; do
            [ -z "$id" ] && continue
            echo "run $id"; R=$((R+1))
            [ "$DRY" = "true" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" > /dev/null || true
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&status=completed" --jq '.workflow_runs[] | select(.name|startswith("Cloud Android")) | select(.name != "Cloud Android Cleanup") | "\(.created_at) \(.id)"' | sort -r | awk -v k="$KEEP" 'NR>k {print $2}')
          echo "### Cleanup ($DRY dry run)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifacts: $N (about $((BYTES/1048576)) MB)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Old runs: $R" >> "$GITHUB_STEP_SUMMARY"
