name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]   # every upload/commit (including a new project .zip) builds a new APK

permissions:
  contents: write              # needed to create the GitHub Release

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}

      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}

      # 1) Find the Android project. If a project .zip was uploaded to the repo, extract the newest one;
      #    otherwise build the project that is already in the repo.
      - name: Extract uploaded project ZIP (or use repo project)
        run: |
          set -euo pipefail
          ZIP=""; BEST=0
          while IFS= read -r -d '' z; do
            t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0); t=${t:-0}
            if [ "$t" -ge "$BEST" ]; then BEST=$t; ZIP=$z; fi
          done < <(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -not -path './_project/*' -print0)

          if [ -n "$ZIP" ]; then
            echo "Extracting project ZIP: $ZIP"
            rm -rf _project && mkdir _project
            unzip -q -o "$ZIP" -d _project -x '__MACOSX/*'
            SETTINGS=$(find _project -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' | head -1)
            [ -n "$SETTINGS" ] || { echo "::error::No settings.gradle(.kts) found inside $ZIP"; exit 1; }
            PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)
          elif [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "No ZIP found; building the project in the repo root"
            PROJECT_DIR=$GITHUB_WORKSPACE
          else
            echo "::error::No Android project found. Upload your project .zip (or the project files) to the repo."; exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"; ls "$PROJECT_DIR"

      # 2) Rebuild the keystore from your 4 existing secrets.
      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/a2z-release.jks"
          test -s "$RUNNER_TEMP/a2z-release.jks" || { echo "::error::KEYSTORE_BASE64 decoded to an empty file"; exit 1; }

      # 2b) Built-in API keys -> assets/default-keys.json inside the APK (the app works right after first open).
      #     ONE secret named AI_API holds every key, one per line as  provider:key  (provider = pollinations, openrouter, gemini, groq, tavily, youtube).
      #     The line order is the fallback order: the first text provider is the primary one. Lines starting with #, empty lines, lines with PASTE_KEY and lines with no key after the colon are ignored.
      #     (Old secret AI_KEYS, if it still exists, is added after AI_API.)
      - name: Add built-in API keys from secrets
        env:
          AI_API: ${{ secrets.AI_API }}
          AI_KEYS: ${{ secrets.AI_KEYS }}
        run: |
          set -euo pipefail
          OUT="$PROJECT_DIR/app/src/main/assets/default-keys.json"
          mkdir -p "$(dirname "$OUT")"
          LINES="$RUNNER_TEMP/keys.txt"; : > "$LINES"
          for S in "${AI_API:-}" "${AI_KEYS:-}"; do
            [ -n "$S" ] && printf '%s\n' "$S" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v -E '^(#|$)' | grep -v -i -E 'PASTE_KEY|^[A-Za-z]+[[:space:]]*[:=][[:space:]]*$' >> "$LINES" || true
          done
          if [ -s "$LINES" ]; then jq -R . < "$LINES" | jq -s . > "$OUT"; else echo '[]' > "$OUT"; echo "::warning::Secret AI_API is empty or missing - APK will have no built-in keys"; fi
          echo "Built-in keys: pollinations=$(grep -ci '^pollinations[:=]' "$LINES" || true) openrouter=$(grep -ci '^openrouter[:=]' "$LINES" || true) gemini=$(grep -ci '^gemini[:=]' "$LINES" || true) groq=$(grep -ci '^groq[:=]' "$LINES" || true) tavily=$(grep -ci '^tavily[:=]' "$LINES" || true) youtube=$(grep -ci '^youtube[:=]' "$LINES" || true) total=$(jq length "$OUT")"
          if grep -v -i -E '^(pollinations|openrouter|gemini|groq|tavily|youtube|nvidia|deepseek|openai|mistral)[[:space:]]*[:=]' "$LINES" | grep -q .; then echo "::warning::Some lines in AI_API have no provider: prefix - the app will guess the provider from the key shape (YouTube and Tavily keys need the prefix)"; fi
          rm -f "$LINES"

      # 3) Signed release build (app/build.gradle.kts reads these env vars).
      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/a2z-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          set -euo pipefail
          APK=$(ls "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/sign.txt" | grep -E "Verifies|SHA-(1|256)"
          if grep -qi "Android Debug" "$RUNNER_TEMP/sign.txt"; then echo "::error::APK is signed with a debug key"; exit 1; fi
          echo "APK_SRC=$APK" >> "$GITHUB_ENV"

      - name: Name the APK
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp "$APK_SRC" "$GITHUB_WORKSPACE/Zyn-Ai-${TAG}.apk"

      # 4) Shows under the run page > Artifacts as "Zyn-Ai-Release-APK".
      - name: Upload APK to run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zyn-Ai-Release-APK
          path: Zyn-Ai-${{ env.TAG }}.apk
          if-no-files-found: error
          retention-days: 30

      # 5) Also publish under GitHub Releases (direct .apk download).
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "Zyn-Ai-${TAG}.apk" --repo "$GITHUB_REPOSITORY" --title "Zyn Ai ${TAG}" --notes "Signed release APK (build #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7})" --target "$GITHUB_SHA" \
            || gh release upload "$TAG" "Zyn-Ai-${TAG}.apk" --repo "$GITHUB_REPOSITORY" --clobber
