name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]   # every upload/commit (including a new project .zip) builds a new APK

permissions:
  contents: write              # needed to create the GitHub Release
  id-token: write              # build provenance attestation (verifiable build origin)
  attestations: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the newest project .zip can be found by its commit time

      # 0) If repo-root-files.zip was uploaded, unpack the docs into the repo root (like the project ZIP is unpacked) and commit them.
      #    .github/workflows/* inside it is skipped on purpose: GitHub does not let this workflow change workflow files.
      #    Note: uploading the zip again overwrites any edits you made on GitHub to those files.
      - name: Unpack repo-root-files.zip into the repo root
        run: |
          set -euo pipefail
          Z=$(find . -maxdepth 2 -type f -iname 'repo-root-files*.zip' -not -path './.git/*' | head -1)
          if [ -z "$Z" ]; then echo "No repo-root-files.zip found - skipping"; exit 0; fi
          D="$RUNNER_TEMP/rootfiles"; rm -rf "$D"; mkdir -p "$D"
          unzip -q -o "$Z" -d "$D" -x '__MACOSX/*' '.github/workflows/*'
          cp -r "$D"/. "$GITHUB_WORKSPACE"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          (cd "$D" && find . -type f -print0) | while IFS= read -r -d '' f; do git add -- "$f"; done
          if git diff --cached --quiet; then echo "Docs already up to date"; else
            git commit -m "Update docs from repo-root-files.zip"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Could not push the docs (is the branch protected?). Upload the files by hand."
          fi

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}

      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}

      # 1) Find the Android project. If a project .zip was uploaded to the repo, extract the newest one;
      #    otherwise build the project that is already in the repo.
      - name: Extract uploaded project ZIP (or use repo project)
        run: |
          set -euo pipefail
          ZIP=""; BEST=0
          while IFS= read -r -d '' z; do
            t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0); t=${t:-0}
            if [ "$t" -ge "$BEST" ]; then BEST=$t; ZIP=$z; fi
          done < <(find . -maxdepth 3 -type f -iname '*.zip' -not -iname 'repo-root-files*.zip' -not -iname 'cloud-support*.zip' -not -path './.git/*' -not -path './_project/*' -print0)

          if [ -n "$ZIP" ]; then
            echo "Extracting project ZIP: $ZIP"
            rm -rf _project && mkdir _project
            unzip -q -o "$ZIP" -d _project -x '__MACOSX/*'
            SETTINGS=$(find _project -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' -not -path '*/cloud-projects/*' -not -path '*/tools/*' | awk '{print gsub("/","/"), $0}' | sort -n | head -1 | cut -d' ' -f2-)
            [ -n "$SETTINGS" ] || { echo "::error::No settings.gradle(.kts) found inside $ZIP"; exit 1; }
            PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)
          elif [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "No ZIP found; building the project in the repo root"
            PROJECT_DIR=$GITHUB_WORKSPACE
          else
            echo "::error::No Android project found. Upload your project .zip (or the project files) to the repo."; exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"; ls "$PROJECT_DIR"

      # 2) Rebuild the keystore from your 4 existing secrets.
      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/a2z-release.jks"
          test -s "$RUNNER_TEMP/a2z-release.jks" || { echo "::error::KEYSTORE_BASE64 decoded to an empty file"; exit 1; }

      # 2b) Built-in API keys -> assets/default-keys.json inside the APK (the app works right after first open).
      #     ONE secret named AI_API holds every key, one per line as  provider:key  (provider = pollinations, openrouter, gemini, groq, tavily, youtube).
      #     NOTE: the pollinations key in this secret is used for TEXT chat only. The app never uses it for image or video generation; users must add their own Pollinations key (Settings > AI providers) to make images or videos.
      #     The line order is the fallback order: the first text provider is the primary one. Lines starting with #, empty lines, lines with PASTE_KEY and lines with no key after the colon are ignored.
      #     (Old secret AI_KEYS, if it still exists, is added after AI_API.)
      - name: Add built-in API keys from secrets
        env:
          AI_API: ${{ secrets.AI_API }}
          AI_KEYS: ${{ secrets.AI_KEYS }}
        run: |
          set -euo pipefail
          OUT="$PROJECT_DIR/app/src/main/assets/default-keys.json"
          mkdir -p "$(dirname "$OUT")"
          LINES="$RUNNER_TEMP/keys.txt"; : > "$LINES"
          for S in "${AI_API:-}" "${AI_KEYS:-}"; do
            [ -n "$S" ] && printf '%s\n' "$S" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v -E '^(#|$)' | grep -v -i -E 'PASTE_KEY|^[A-Za-z]+[[:space:]]*[:=][[:space:]]*$' >> "$LINES" || true
          done
          if [ -s "$LINES" ]; then jq -R . < "$LINES" | jq -s . > "$OUT"; else echo '[]' > "$OUT"; echo "::warning::Secret AI_API is empty or missing - APK will have no built-in keys"; fi
          echo "Built-in keys: pollinations=$(grep -ci '^pollinations[:=]' "$LINES" || true) openrouter=$(grep -ci '^openrouter[:=]' "$LINES" || true) gemini=$(grep -ci '^gemini[:=]' "$LINES" || true) groq=$(grep -ci '^groq[:=]' "$LINES" || true) tavily=$(grep -ci '^tavily[:=]' "$LINES" || true) youtube=$(grep -ci '^youtube[:=]' "$LINES" || true) total=$(jq length "$OUT")"
          if grep -v -i -E '^(pollinations|openrouter|gemini|groq|tavily|youtube|nvidia|deepseek|openai|mistral)[[:space:]]*[:=]' "$LINES" | grep -q .; then echo "::warning::Some lines in AI_API have no provider: prefix - the app will guess the provider from the key shape (YouTube and Tavily keys need the prefix)"; fi
          rm -f "$LINES"

      # 3) Signed release build (app/build.gradle.kts reads these env vars).
      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/a2z-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          set -euo pipefail
          APK=$(ls "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/sign.txt" | grep -E "Verifies|SHA-(1|256)"
          if grep -qi "Android Debug" "$RUNNER_TEMP/sign.txt"; then echo "::error::APK is signed with a debug key"; exit 1; fi
          echo "APK_SRC=$APK" >> "$GITHUB_ENV"

      # 3b) The release certificate must never change between versions (Play Protect reputation, updates and Firebase sign-in all depend on it).
      #     One-time setup: Settings > Secrets and variables > Actions > Variables > New variable  EXPECTED_CERT_SHA256 = the SHA-256 printed by the first good build.
      - name: Check release certificate fingerprint
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          CERT=$(grep -m1 -i 'certificate SHA-256 digest' "$RUNNER_TEMP/sign.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')
          [ -n "$CERT" ] || { echo "::error::Could not read the signing certificate SHA-256"; exit 1; }
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          EXP=$(printf '%s' "${EXPECTED_CERT_SHA256:-}" | tr -d ': \r\n' | tr 'A-F' 'a-f')
          if [ -z "$EXP" ]; then
            echo "::warning::Variable EXPECTED_CERT_SHA256 is not set, so certificate consistency is NOT enforced. Set it to: $CERT"
          elif [ "$EXP" != "$CERT" ]; then
            echo "::error::Signing certificate changed. Expected $EXP but this build is signed with $CERT. Stopping so users are not given an APK that cannot update the installed app."; exit 1
          fi

      # 3c) Package identity + permission report (also shown on the run summary page).
      - name: Check package identity and permissions
        env:
          EXPECTED_PACKAGE: com.a2z.ai
        run: |
          set -euo pipefail
          BT=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK_SRC" > "$RUNNER_TEMP/badging.txt"
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -1)
          VER=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -1)
          TSDK=$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -1)
          [ "$PKG" = "$EXPECTED_PACKAGE" ] || { echo "::error::Package name is '$PKG' but must stay '$EXPECTED_PACKAGE'"; exit 1; }
          {
            echo "### APK identity"
            echo "- Package: $PKG"
            echo "- Version name: $VER"
            echo "- Target SDK: $TSDK"
            echo "- Signing certificate SHA-256: $CERT_SHA256"
            echo ""
            echo "### Permissions in this APK"
            grep -E "^uses-permission" "$RUNNER_TEMP/badging.txt" | sed "s/^/- /"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK and create SHA-256 checksum
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp "$APK_SRC" "$GITHUB_WORKSPACE/Zen-Ai-${TAG}.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum "Zen-Ai-${TAG}.apk" > "Zen-Ai-${TAG}.apk.sha256"
          APK_SHA256=$(cut -d' ' -f1 "Zen-Ai-${TAG}.apk.sha256")
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "APK SHA-256: $APK_SHA256"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Signed release APK (build #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}).

          Package name: com.a2z.ai

          APK SHA-256:
          ${APK_SHA256}

          Signing certificate SHA-256 (the same on every genuine Zen Ai release):
          ${CERT_SHA256}

          How to check your download: compute the SHA-256 of the file and compare it with the value above, or with the attached .sha256 file. See VERIFY.md in the repository.

          About Google Play Protect: Zen Ai is distributed outside Google Play. Play Protect may warn about apps from new developers and about apps that use the Accessibility service. Zen Ai does not try to bypass or disable Play Protect. What the app does and why it needs each permission is listed in PERMISSIONS.md; the privacy policy is PRIVACY_POLICY.md.
          EOF

      # 4) Shows under the run page > Artifacts as "Zen-Ai-Release-APK".
      - name: Upload APK to run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zen-Ai-Release-APK
          path: |
            Zen-Ai-${{ env.TAG }}.apk
            Zen-Ai-${{ env.TAG }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # 4b) Signed statement from GitHub that this APK was built by this workflow from this commit (public repositories).
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: Zen-Ai-${{ env.TAG }}.apk

      # 5) Also publish under GitHub Releases (direct .apk download + checksum).
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "Zen-Ai-${TAG}.apk" "Zen-Ai-${TAG}.apk.sha256" --repo "$GITHUB_REPOSITORY" --title "Zen Ai ${TAG}" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" \
            || { gh release upload "$TAG" "Zen-Ai-${TAG}.apk" "Zen-Ai-${TAG}.apk.sha256" --repo "$GITHUB_REPOSITORY" --clobber; gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"; }
